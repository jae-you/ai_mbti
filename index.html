<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맡길까, 직접 할까</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEAE0; --surface:#FFFDF9; --ink:#221F1A; --muted:#6E685C; --line:#DAD3C5;
  --mine:#1F6F6B; --mine-soft:#DCEEEC; --theirs:#8A8175; --flag:#C2502F;
  --serif:"Noto Serif KR",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171613; --surface:#211F1B; --ink:#EFEAE0; --muted:#A09889; --line:#38352E;
  --mine:#4FB3AD; --mine-soft:#12302E; --theirs:#9A917F; --flag:#E57E5C;
}}
:root[data-theme="dark"]{--bg:#171613;--surface:#211F1B;--ink:#EFEAE0;--muted:#A09889;--line:#38352E;--mine:#4FB3AD;--mine-soft:#12302E;--theirs:#9A917F;--flag:#E57E5C}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:28px 22px 36px}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--mine);outline-offset:2px}
.btn{border-radius:14px;padding:14px 18px;font-weight:600;background:var(--ink);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,8vw,40px);line-height:1.25;margin:0 0 10px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:700;font-size:21px;margin:0 0 8px}
.lede{font-size:17px;margin:0 0 24px}
.sub{color:var(--muted);margin:0 0 20px}
.fine{font-size:14px;color:var(--muted);background:var(--surface);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.fine p{margin:0 0 8px}.fine p:last-child{margin:0}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--ink)}

/* stage 1 */
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.top .step{font-size:13px;color:var(--muted);font-weight:600}
.track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}
.card .tagline{font-size:13px;color:var(--muted);margin-bottom:8px}
.card .body{font-family:var(--serif);font-size:19px;line-height:1.55;word-break:keep-all}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink)}
.opt b{display:block;font-size:16px;margin-bottom:2px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.why{margin-top:14px}
.why p{font-size:14px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:8px 13px;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:#fff}

/* stage 2 */
.thread{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.msg{max-width:88%;padding:11px 15px;border-radius:16px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;word-break:keep-all;animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;margin-bottom:3px;color:var(--theirs)}
.msg.mine{align-self:flex-end;background:var(--mine-soft);border-color:var(--mine)}
.msg.mine .lbl{color:var(--mine)}
.deal{background:var(--surface);border:2px solid var(--mine);border-radius:18px;padding:16px 18px;margin:8px 0 18px}
.deal h3{margin:0 0 8px;font-size:13px;color:var(--mine);font-weight:700}
.deal ul{margin:10px 0 0;padding-left:18px;font-size:14px}
.deal li{margin-bottom:4px}
.working{color:var(--muted);font-size:14px;padding:10px 0}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.scale button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 0;font-weight:600}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.anch{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.q p{margin:0 0 12px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid2 button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 8px;font-weight:500}
.grid2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cc{font-weight:700;font-size:20px;letter-spacing:.06em}
.err{color:var(--flag);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="stimuli.js"></script>
<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  // Apps Script 웹앱 URL과 공유 토큰 (응답 저장용. API 키는 필요 없습니다)
  endpoint: "https://script.google.com/macros/s/AKfycbzHKI3LB47ToS7PdU4jp7TBig0pGC_HFtOjXoeFH9mG1KVSQIfrWf3KaQ8PgJwabXARqg/exec",
  token: "jy-2026-delegation",
  gameCount: 3,
  irbText: "연구책임자 유재연 · 문의 sandrine86@hanyang.ac.kr",
  shareUrl: "https://jae-you.github.io/ai_mbti/"   // 배포 주소. null이면 현재 주소를 씁니다
};

/* ===================== 시나리오 16 =====================
   block: coord(순수 조율) | edge(경계) | exception(예외 후보)
   status: up | eq | down | none
   cont: true(계속 볼 사람) | false
   prec: 선례성  expr: 표명성
======================================================= */
const SCN = [
  {id:"C1", block:"coord", status:"eq", cont:true, prec:0, expr:0,
   t:"팀 회의 시간 잡기", s:"팀원 6명의 일정이 제각각입니다. 다음 주 안에 한 시간짜리 회의를 잡아야 합니다."},
  {id:"C2", block:"coord", status:"eq", cont:true, prec:0, expr:0,
   t:"여행 경비 정산", s:"4명이 함께 다녀온 여행에서 각자 다른 항목을 결제했습니다. 금액이 제각각이라 정산이 필요합니다."},
  {id:"C3", block:"coord", status:"none", cont:false, prec:0, expr:0,
   t:"호텔 예약 변경", s:"예약한 숙박 날짜를 하루 미루고 싶습니다. 변경 규정과 수수료를 호텔과 확인해야 합니다."},
  {id:"C4", block:"coord", status:"eq", cont:true, prec:0, expr:0,
   t:"공동구매 물량 배분", s:"같이 주문한 사람들끼리 수량과 수령 장소, 시간을 맞춰야 합니다."},
  {id:"C5", block:"coord", status:"none", cont:false, prec:0, expr:0,
   t:"중고거래 시간 조율", s:"가격은 이미 합의됐습니다. 만날 시간과 장소만 정하면 됩니다."},
  {id:"C6", block:"coord", status:"none", cont:false, prec:0, expr:0,
   t:"이사 견적 비교", s:"이사업체 세 곳에서 견적을 받아 날짜와 조건을 비교하고 한 곳을 골라야 합니다."},
  {id:"C7", block:"coord", status:"eq", cont:true, prec:0, expr:0,
   t:"스터디 발표 순서", s:"스터디원들이 각자 피하고 싶은 주가 있습니다. 발표 순서를 정해야 합니다."},
  {id:"C8", block:"coord", status:"eq", cont:true, prec:0, expr:0,
   t:"렌터카 분담", s:"함께 가는 사람들과 픽업 시간, 운전 구간 분담을 정해야 합니다."},

  {id:"E1", block:"edge", status:"none", cont:true, prec:0, expr:0,
   t:"단골집 예약 취소", s:"세 번 미룬 끝에 결국 취소해야 합니다. 자주 가는 가게이고 사장님과 얼굴을 아는 사이입니다."},
  {id:"E2", block:"edge", status:"eq", cont:true, prec:1, expr:0,
   t:"작업 범위 재협의", s:"의뢰받은 작업에 추가 요청이 계속 들어옵니다. 범위와 금액을 다시 정해야 합니다."},
  {id:"E3", block:"edge", status:"up", cont:true, prec:0, expr:0,
   t:"명절 일정 조정", s:"부모님이 이미 잡아두신 일정이 있는데 사정상 조정이 필요합니다."},
  {id:"E4", block:"edge", status:"eq", cont:true, prec:1, expr:0,
   t:"업무 재분배", s:"같은 팀의 한 사람이 계속 몫을 덜 하고 있습니다. 업무 분담을 다시 정해야 합니다."},

  {id:"X1", block:"exception", status:"eq", cont:true, prec:1, expr:0,
   t:"공동 논문 저자 순서", s:"함께 쓴 논문의 저자 순서를 정해야 합니다. 서로 기여했다고 보는 부분이 다릅니다."},
  {id:"X2", block:"exception", status:"up", cont:true, prec:1, expr:0,
   t:"선배의 부탁 거절", s:"오래 신세를 진 선배의 부탁을 처음으로 거절해야 하는 상황입니다."},
  {id:"X3", block:"exception", status:"eq", cont:true, prec:0, expr:1,
   t:"조의 전하기", s:"같이 일하는 사람이 상을 당했습니다. 마음을 전해야 합니다."},
  {id:"X4", block:"exception", status:"none", cont:true, prec:0, expr:1,
   t:"내 실수에 대한 사과", s:"내 잘못으로 상대가 손해를 봤습니다. 사과하고 수습해야 합니다."}
];

/* 작업군: 구체적인 것부터 먼저 잡는다 (표명 > 선례 > 경계 > 조율) */
const BUCKETS = [
  {k:"expr",  label:"사과·조의처럼 내가 했다는 사실이 전달되는 일",
   test:x=>x.expr===1},
  {k:"prec",  label:"이번 결정이 다음번의 기준이 되는 일",
   test:x=>x.prec===1},
  {k:"edge",  label:"관계가 걸린 조정이나 취소",
   test:x=>x.block==="edge"},
  {k:"coord", label:"일정·정산·예약처럼 되돌릴 수 있는 조율",
   test:x=>x.block==="coord"}
];
const CHOICE_TEXT = {auto:"AI가 알아서 처리", cond:"못 하게 할 것을 정하고 맡김", self:"내가 직접"};

function bucketOf(sc){
  for(const b of BUCKETS) if(b.test(sc)) return b.k;
  return "coord";
}
function derivePolicy(){
  const byB = {};
  S.stage1.forEach(a=>{
    const sc = SCN.find(x=>x.id===a.id); if(!sc) return;
    const k = bucketOf(sc);
    (byB[k] = byB[k] || []).push(a.choice);
  });
  const rules = BUCKETS.filter(b=>byB[b.k] && byB[b.k].length).map(b=>{
    const cnt = {auto:0, cond:0, self:0};
    byB[b.k].forEach(c=> cnt[c]!==undefined && cnt[c]++);
    const top = Object.keys(cnt).sort((x,y)=> cnt[y]-cnt[x] || ["self","cond","auto"].indexOf(y)-["self","cond","auto"].indexOf(x))[0];
    const n = byB[b.k].length;
    return {bucket:b.k, label:b.label, derived:top, n, agree:+(cnt[top]/n).toFixed(2)};
  });
  const banCount = {};
  S.stage1.forEach(a=>(a.bans||[]).forEach(x=> banCount[x]=(banCount[x]||0)+1));
  S.stage2.forEach(a=>(a.bans2||[]).forEach(x=> banCount[x]=(banCount[x]||0)+1));
  const bans = Object.entries(banCount).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>=2).slice(0,3).map(e=>e[0]);
  return {rules, bans};
}

const PERSONA = {
  twin:   {tip:"웬만한 건 맡겨도 괜찮아요. 다만 이번 합의가 다음번의 기준이 되는 자리 — 역할 분담, 가격, 저자 순서 같은 것 — 에서는 한 번쯤 직접 확인해 보시면 좋겠어요. 한 번 정해진 기준은 생각보다 오래 갑니다.", emoji:"🧬", name:"AI 쌍둥이형", line:"나는 AI한테 거의 다 맡기는 사람!",
           desc:"웬만한 조율은 AI가 처리하는 게 낫다고 보는 쪽이에요. 손이 가는 일을 붙들고 있기보다, 결과만 받아보고 다음 일로 넘어갑니다."},
  chief:  {tip:"맡길 것과 아닌 것을 가르는 감이 또렷한 편이에요. 사람 마음이 걸린 자리만 손에 쥐고 계시면, 나머지는 조금 더 과감히 넘기셔도 괜찮습니다.", emoji:"🗂️", name:"비서실장형", line:"일은 맡기고, 사람 일은 내가!",
           desc:"대부분 맡기지만 사람 마음이 걸린 일은 손에 쥐고 있어요. 맡길 것과 아닌 것의 선이 비교적 또렷한 편입니다."},
  ruler:  {tip:"선을 긋고 맡기는 방식은 지금의 AI 서비스들이 가장 잘 받아주는 방식이에요. 다만 선은 처음에 한 번 긋고 끝이 아니라, 결과를 보고 다시 그을 때 더 정확해집니다.", emoji:"📏", name:"조건파형", line:"선부터 긋고 맡기는 사람!",
           desc:"그냥 맡기는 건 불안하고, 아예 안 맡기는 건 비효율이라고 생각해요. 넘지 말 선을 정해두는 쪽을 가장 편하게 느낍니다."},
  dial:   {tip:"매번 따로 판단하는 건 품이 들지만 가장 안전한 방식이기도 해요. 자주 반복되는 일부터 기준을 정해두시면, 정작 고민이 필요한 자리에 생각을 더 쓸 수 있을 거예요.", emoji:"🎚️", name:"케바케형", line:"상황 봐서 가르는 사람!",
           desc:"맡길 일과 아닌 일을 매번 따로 판단해요. 기준이 없는 게 아니라, 상황마다 기준이 다른 쪽입니다."},
  letter: {tip:"전해지는 마음을 먼저 보는 쪽이시네요. 다만 일정 조율이나 정산처럼 틀려도 다시 하면 되는 일까지 끌어안고 계시면 금방 지칩니다. 그런 건 조금 내려놓으셔도 괜찮아요.", emoji:"✉️", name:"손편지형", line:"중요한 말은 내 입으로!",
           desc:"효율보다 전해지는 마음을 먼저 봅니다. 특히 관계가 걸린 자리에서는 내가 직접 말해야 마음이 놓이는 쪽이에요."},
  wheel:  {tip:"핸들을 쥐고 계신 만큼 놓치는 건 적겠지만 그만큼 손이 많이 가요. 되돌릴 수 있고 관계가 걸리지 않은 일부터 한두 개쯤 맡겨보시면 감이 달라질지도 몰라요.", emoji:"🕹️", name:"운전대형", line:"나는 AI랑 아직 거리를 두는 사람!",
           desc:"AI가 잘한다는 건 알겠지만, 내 일의 핸들은 내가 쥐고 있어야 한다고 생각해요. 맡기는 일은 아주 좁게 고릅니다."}
};
function typeMe(){
  const n = S.stage1.length || 1;
  const c = {auto:0, cond:0, self:0};
  S.stage1.forEach(a=> c[a.choice]!==undefined && c[a.choice]++);
  const deleg = (c.auto + c.cond*0.5) / n;
  const comm = S.pre ? (S.pre.comm1+S.pre.comm2+S.pre.comm3+S.pre.comm4)/4 : 4;
  const dir  = S.pre ? (S.pre.dir1+S.pre.dir2)/2 : 4;
  const rel  = comm - dir;
  let key;
  if(deleg >= .7) key = rel > 0 ? "chief" : "twin";
  else if(deleg >= .4) key = (c.cond >= c.self) ? "ruler" : "dial";
  else key = rel > 0 ? "letter" : "wheel";
  const banCount = {};
  S.stage1.forEach(a=> (a.bans||[]).forEach(b=> banCount[b]=(banCount[b]||0)+1));
  S.stage2.forEach(a=> (a.bans2||[]).forEach(b=> banCount[b]=(banCount[b]||0)+1));
  const topBan = Object.entries(banCount).sort((x,y)=>y[1]-x[1])[0];
  const kept = S.stage1.filter(a=>a.choice==="self").map(a=>(SCN.find(x=>x.id===a.id)||{}).t).filter(Boolean);
  const note = [];
  const precIds = SCN.filter(x=>x.prec).map(x=>x.id);
  const gavePrec = S.stage1.filter(a=>a.choice==="auto" && precIds.includes(a.id)).length;
  const keptCoord = S.stage1.filter(a=>a.choice==="self" && (SCN.find(x=>x.id===a.id)||{}).block==="coord").length;
  const refused = S.stage2.filter(a=>a.action==="neither").length;
  if(gavePrec >= 2) note.push("다음번의 기준이 될 만한 자리까지 선뜻 넘기신 편이에요. 그런 자리는 한 번 더 들여다보셔도 좋겠어요.");

  return {key, ...PERSONA[key], deleg, counts:c, topBan: topBan? topBan[0]:null, kept, note};
}

/* Apps Script 왕복. 프리플라이트를 피하려고 text/plain으로 보낸다. */
async function callApi(payload, tries){
  if(!endpointReady()) throw new Error("endpoint_not_set");
  tries = tries || 2;
  let last;
  for(let k=0; k<tries; k++){
    try{
      const r = await fetch(CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({token: CONFIG.token, ...payload})});
      const t = await r.text();
      let j; try{ j = JSON.parse(t); }
      catch(_){ throw new Error("non_json_response: " + t.slice(0,80)); }
      if(j && j.ok) return j;
      throw new Error((j && j.error) || "bad_response");
    }catch(e){ last = e; await sleep(900*(k+1)); }
  }
  throw last;
}

/* 기록 전송: 단계가 끝날 때만 보낸다(세션당 5~6회) */
let saveChain = Promise.resolve();
function persist(){
  const snap = JSON.parse(JSON.stringify(S)); snap.updatedAt = now();
  saveChain = saveChain.then(async()=>{
    if(!endpointReady()){ if(!persist._warned){ persist._warned = true;
      console.info("[설정] CONFIG.endpoint가 비어 있어 응답을 저장하지 않습니다. 배포 전 테스트라면 정상입니다."); } return; }
    try{ await callApi({action:"log", session:snap}); }catch(e){ console.warn("기록 전송 실패:", e.message); }
  });
  return saveChain;
}
function persistBeacon(){
  if(!endpointReady() || !navigator.sendBeacon) return;
  const snap = JSON.parse(JSON.stringify(S)); snap.updatedAt = now();
  try{ navigator.sendBeacon(CONFIG.endpoint,
    new Blob([JSON.stringify({token:CONFIG.token, action:"log", session:snap})], {type:"text/plain;charset=utf-8"})); }catch(e){}
}

/* 자극은 stimuli.js에 고정되어 있다. 모든 참가자가 같은 글을 본다. */
function getStimulus(scenarioId, factorKey){
  if(typeof STIMULI === "undefined"){
    console.error("stimuli.js를 불러오지 못했습니다. index.html과 같은 폴더에 두고 웹서버로 열어주세요.");
    return {error:"stimuli_not_loaded"};
  }
  const v = STIMULI[scenarioId + "|" + factorKey];
  if(!v || !v.v1 || !v.v2) return {error:"missing_stimulus"};
  return {data:{v1:v.v1, v2:v.v2}, fixed:true};
}

function pickScenarios(){
  const by = k => shuffle(S.stage1.filter(a=>a.choice===k));
  const picks = [];
  const autos = by("auto"), selfs = by("self"), conds = by("cond");
  if(autos[0]) picks.push({id:autos[0].id, reason:"said_auto"});
  if(selfs[0]) picks.push({id:selfs[0].id, reason:"said_self"});
  else if(conds[0]) picks.push({id:conds[0].id, reason:"said_cond"});
  const rest = shuffle(S.stage1.filter(a=>!picks.some(p=>p.id===a.id)));
  while(picks.length < CONFIG.gameCount && rest.length) picks.push({id:rest.shift().id, reason:"random"});
  const out = shuffle(picks).slice(0, CONFIG.gameCount);
  const fs = shuffle(["concession","closure","concession","closure"]);
  out.forEach((p,i)=>{ p.factor = fs[i]; p.flip = Math.random()<0.5; });
  return out;
}

    document.querySelectorAll("#chips .chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); upd(); };
  $("#bans2").onclick = e=>{ const b=e.target.closest(".chip"); if(!b) return;
    const v=b.dataset.b, on=b.getAttribute("aria-pressed")==="true";
    b.setAttribute("aria-pressed", String(!on));
    bans2 = on ? bans2.filter(x=>x!==v) : bans2.concat(v); upd(); };
  document.querySelectorAll(".scale").forEach(g=> g.onclick = e=>{
    const b=e.target.closest("button"); if(!b) return;
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    sc7[g.dataset.k]=+b.dataset.v; upd(); });
  $("#next").onclick = ()=>{
    const chosen = act==="first" ? shown[0] : act==="second" ? shown[1] : null;
    S.stage2.push({id:pick.id, reason:pick.reason, factor:pick.factor, order:i,
      flip:pick.flip, shownOrder:[shown[0].level, shown[1].level],
      action:act, chosenLevel: chosen? chosen.level : null, why, bans2,
      match:sc7.match, variants:{v1:res.data.v1, v2:res.data.v2},
      viewMs:now()-t0});
    persist(); renderStage2(i+1);
  };
}

/* ---------- final survey ---------- */
function renderSurvey(){
  const items = [
    ["general","일상적인 조율은 에이전트끼리 처리해도 괜찮다."],
    ["boundary","어디까지 맡겨도 되는지 나는 스스로 잘 안다."]
  ];
  const picks = [
    ["age","나이대",["20대","30대","40대","50대 이상"]],
    ["use","AI 에이전트·비서 사용 경험",["없음","써본 적 있음","가끔 씀","자주 씀"]]
  ];
  app.innerHTML = `<div class="scroll">
    <h2>마지막 ${items.length+picks.length}문항</h2>
    <p class="sub">느낀 대로 골라주세요.</p>
    ${items.map(([k,q])=>`<div class="q" data-k="${k}"><p>${esc(q)}</p>
      <div class="scale" data-k="${k}">${[1,2,3,4,5,6,7].map(v=>`<button data-v="${v}" aria-pressed="false">${v}</button>`).join("")}</div>
      <div class="anch"><span>전혀 아니다</span><span>매우 그렇다</span></div></div>`).join("")}
    ${picks.map(([k,q,os])=>`<div class="q" data-k="${k}"><p>${esc(q)}</p>
      <div class="grid2" data-k="${k}">${os.map(o=>`<button data-v="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    <button class="btn" id="fin" disabled>끝내기</button>
  </div>`;
  const ans={}, need=items.length+picks.length;
  document.querySelectorAll(".scale,.grid2").forEach(g => g.onclick = e=>{
    const b=e.target.closest("button"); if(!b) return;
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    const v=b.dataset.v; ans[g.dataset.k]= isNaN(+v)? v : +v;
    $("#fin").disabled = Object.keys(ans).length < need; });
  $("#fin").onclick = ()=>{ S.survey={...ans,t:now()}; persist(); renderPolicy(); };
}
function renderPolicy(){
  const pol = derivePolicy();
  app.innerHTML = `<div class="scroll">
    <h2>당신의 위임 정책</h2>
    <p class="sub">답하신 내용에서 뽑아낸 규칙이에요. 틀린 줄이 있으면 고쳐주세요.</p>
    ${pol.rules.map((r,i)=>`
      <div class="q" data-i="${i}">
        <p style="margin-bottom:6px">${esc(r.label)}</p>
        <div style="font-weight:700;margin-bottom:12px">→ ${esc(CHOICE_TEXT[r.derived])}</div>
        <div class="grid2" data-role="verdict">
          <button data-v="ok" aria-pressed="false">맞아요</button>
          <button data-v="no" aria-pressed="false">아니에요</button>
        </div>
        <div class="why fix" hidden style="margin-top:10px">
          <p>그럼 어느 쪽인가요?</p>
          <div class="chips" data-role="fix">
            ${["auto","cond","self"].map(k=>`<button class="chip" data-k="${k}" aria-pressed="false">${esc(CHOICE_TEXT[k])}</button>`).join("")}
          </div>
        </div>
      </div>`).join("")}
    ${pol.bans.length?`<div class="q"><p style="margin-bottom:6px">어떤 경우에도 AI가 하지 않았으면 하는 것</p>
      <div style="font-weight:700">→ ${esc(pol.bans.join(", "))}</div></div>`:""}
    <button class="btn" id="fin" disabled>결과 보기</button>
  </div>`;
  const state = pol.rules.map(()=>({verdict:null, fixed:null}));
  const upd = ()=> $("#fin").disabled = !state.every(x=> x.verdict==="ok" || (x.verdict==="no" && x.fixed));
  document.querySelectorAll(".q[data-i]").forEach(q=>{
    const i = +q.dataset.i;
    q.addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      const grp = b.parentElement.dataset.role;
      if(grp==="verdict"){
        state[i].verdict = b.dataset.v;
        b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
        q.querySelector(".fix").hidden = (b.dataset.v!=="no");
        if(b.dataset.v==="ok"){ state[i].fixed=null; q.querySelectorAll('[data-role="fix"] .chip').forEach(c=>c.setAttribute("aria-pressed","false")); }
      }
      if(grp==="fix"){
        state[i].fixed = b.dataset.k;
        b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
      }
      upd();
    });
  });
  $("#fin").onclick = ()=>{
    pol.rules.forEach((r,i)=>{ r.confirmed = state[i].verdict==="ok"; r.corrected = state[i].fixed || null; });
    pol.accuracy = +(pol.rules.filter(r=>r.confirmed).length / pol.rules.length).toFixed(2);
    S.policy = pol; S.status="complete"; S.completedAt=now(); persist(); renderDone();
  };
}

function policyJSON(){
  const p = S.policy || derivePolicy();
  return JSON.stringify({
    version:"1.0",
    created:new Date().toISOString().slice(0,10),
    delegation_rules:(p.rules||[]).map(r=>({task_class:r.bucket, description:r.label,
      level:r.corrected || r.derived, source: r.corrected? "user_corrected":"derived"})),
    never_allow:p.bans || [],
    notes:"에이전트에 주입할 수 있는 개인별 위임 정책. level: auto(알아서) / cond(제한 후 위임) / self(직접)"
  }, null, 2);
}

function renderDone(){
  const r = typeMe();
  S.persona = r.key; persist();
  const url = CONFIG.shareUrl || location.href.split("?")[0];
  const pct = Math.round(r.deleg*100);
  app.innerHTML = `<div class="scroll">
    <p class="sub" style="margin-bottom:4px">당신의 위임 성향은</p>
    <div style="font-size:64px;line-height:1.1">${r.emoji}</div>
    <h1 style="margin:6px 0 8px">${esc(r.name)}</h1>
    <p class="lede" style="font-weight:600">${esc(r.line)}</p>
    <div class="card"><div class="body" style="font-size:17px">${esc(r.desc)}</div></div>
    <div class="q">
      <p style="margin-bottom:10px">당신에게 한마디</p>
      <div style="font-size:15px">${esc(r.tip)}</div>
      ${r.note.length?`<div style="font-size:15px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">${r.note.slice(0,2).map(n=>`<p style="margin:0 0 8px">${esc(n)}</p>`).join("")}</div>`:""}
      <div class="sub" style="font-size:13px;margin:12px 0 0">${S.stage1.length}가지 중 ${r.counts.auto}가지는 그냥 맡기고, ${r.counts.cond}가지는 선을 긋고 맡기고, ${r.counts.self}가지는 직접 하겠다고 하셨어요.</div>
    </div>
    <div class="stack" style="display:grid;gap:9px;margin-top:6px">
      <button class="btn" id="share">결과 공유하기</button>
      <button class="btn ghost" id="copy">링크 복사하기</button>
      <button class="btn ghost" id="pol">내 위임 정책 내려받기</button>
    </div>
    <p class="sub" id="msg" style="margin-top:10px"></p>
    <div class="fine" style="margin-top:18px">
      <p>이 테스트는 "AI에게 무엇까지 맡길 수 있는가"를 알아보는 연구의 일부예요. 보신 에이전트 대화는 연구용으로 생성된 것이며 실제 상대와 주고받은 대화가 아닙니다.</p>
      <p>${esc(CONFIG.irbText)}</p>
    </div>
  </div>`;
  const text = `나는 ${r.emoji} ${r.name}! "${r.line}"\n당신은 AI에게 어디까지 맡기는 사람인가요?`;
  $("#share").onclick = async()=>{
    try{
      if(navigator.share){ await navigator.share({title:"나한테 맞는 AI 에이전트는?", text, url}); return; }
      await navigator.clipboard.writeText(text+"\n"+url);
      $("#msg").textContent = "공유 문구를 복사했어요.";
    }catch(e){ $("#msg").textContent = "공유가 어려우면 아래 링크를 복사해 주세요: " + url; }
  };
  $("#pol").onclick = ()=>{
    const txt = policyJSON();
    try{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      a.download = "my-delegation-policy.json"; a.click(); URL.revokeObjectURL(a.href);
      $("#msg").textContent = "에이전트 설정에 넣을 수 있는 형식으로 저장했어요.";
    }catch(e){
      navigator.clipboard.writeText(txt).then(()=> $("#msg").textContent = "정책을 복사했어요.");
    }
  };
  $("#copy").onclick = async()=>{
    try{ await navigator.clipboard.writeText(url); $("#msg").textContent = "링크를 복사했어요."; }
    catch(e){ $("#msg").innerHTML = "이 주소를 복사해 주세요: <b>"+esc(url)+"</b>"; }
  };
}
renderConsent();
window.addEventListener("pagehide", ()=>{ if(S.status!=="complete"&&S.status!=="consent"){ S.status=S.status+"_dropout"; persistBeacon(); } });
</script>
